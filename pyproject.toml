[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lives-on-air"
version = "0.1.0"
description = "Scraping and analysis pipeline for biographical radio drama archive metadata."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4",
  "lxml",
  "pandas",
  "requests",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
